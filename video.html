<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video - LustFlix 4K Cinema</title>
    <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="site-header">
        <div class="container">
            <div class="header-inner">
                <div class="header-brand-wrap">
                    <a href="index.html" class="brand-logo">
                        <span class="logo-icon"><i class="fa-solid fa-film"></i></span>
                        <span>Lust<span class="logo-accent">Flix</span><span class="logo-badge">CINEMA</span></span>
                    </a>
                </div>

                <a href="index.html" class="btn-back-home">
                    <i class="fa-solid fa-arrow-left"></i> Back to Cinema Catalog
                </a>
            </div>
        </div>
    </header>

    <!-- Player Main Section -->
    <main class="player-layout">
        <div class="container">
            
            <!-- Video Player Main Card -->
            <div class="player-main-card">
                
                <div class="video-embed-wrapper yy" id="yy">
                    <!-- iFrame dynamically injected by player.js -->
                </div>

                <div class="player-details-body">
                    <div class="player-title-row">
                        <h1 id="videoTitle" class="player-title">Loading Ultra HD Video...</h1>
                    </div>

                    <div class="player-meta-bar">
                        <div class="meta-left">
                            <span class="meta-pill"><i class="fa-regular fa-eye"></i> <span id="videoViews">200K</span> Views</span>
                            <span class="meta-pill highlight-like"><i class="fa-solid fa-thumbs-up"></i> <span id="videoLikes">98%</span> Rating</span>
                            <span class="meta-pill" style="display:none;"><i class="fa-regular fa-clock"></i> <span id="videoDuration"></span></span>
                            <span class="meta-pill cat-badge" id="videoCategory"><i class="fa-solid fa-tag"></i> Asian</span>
                        </div>

                        <div class="player-actions-toolbar">
                            <button class="tool-btn"><i class="fa-regular fa-heart"></i> Favorite</button>
                            <button class="tool-btn"><i class="fa-solid fa-share-nodes"></i> Share</button>
                            <button class="tool-btn"><i class="fa-solid fa-download"></i> 1080p Download</button>
                            <button class="tool-btn"><i class="fa-regular fa-flag"></i> Report</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom-bar">
                <p>&copy; 2026 LustFlix 4K Cinema. All rights reserved. 18+ Adult Video Portal.</p>
                <p class="compliance-note">
                    <i class="fa-solid fa-shield-halved"></i> 18+ Restricted: All models are 18 years of age or older at the time of production.
                </p>
            </div>
        </div>
    </footer>

    <script src="videos_data.js"></script>
    <script src="player.js"></script>
</body>
</html>
